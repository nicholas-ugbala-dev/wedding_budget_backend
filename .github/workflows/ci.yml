name: PlannerHub Backend CI

on:
    push:
        branches:
            - staging

permissions:
    contents: read
    packages: write
jobs:
    build-and-publish:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                node-version: 22
                cache: npm
            
            - name: Install dependencies
              run: npm ci

            - name: Build application
              run: npm run build

            - name: Login to Github Container Registry
              uses: docker/login-action@v3
              with:
                registry: ghcr.io
                username: ${{ github.actor}}
                password: ${{ secrets.GITHUB_TOKEN }}
            
            - name: Build Docker image
              run: |
                docker build \
                  -t ghcr.io/${{ github.repository_owner }}/plannerhub-backend:staging \
                  -t ghcr.io/${{ github.repository_owner }}/plannerhub-backend:${{ github.sha }} \
                  .

            - name: Push Docker image
              run: |
                docker push ghcr.io/${{ github.repository_owner }}/plannerhub-backend:staging
                docker push ghcr.io/${{ github.repository_owner }}/plannerhub-backend:${{ github.sha }}
    
    deploy:
        name: Deploy to Raspberry Pi
        needs: build-and-publish
        runs-on: ubuntu-latest

        env:
            IMAGE_TAG: ${{ github.sha }}

        steps:
            - name: Configure SSH
              run: |
                mkdir -p ~/.ssh
                echo "${{ secrets.PI_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
                chmod 600 ~/.ssh/id_ed25519
                ssh-keyscan -H ${{ secrets.PI_HOST }} >> ~/.ssh/known_hosts

            - name: Deploy application
              run: |
                ssh \
                  -o BatchMode=yes \
                  -o StrictHostKeyChecking=yes \
                  "${{ secrets.PI_USER }}@${{ secrets.PI_HOST }}" \
                  "cd ~/apps/wedding_budget_backend && IMAGE_TAG=${IMAGE_TAG} ./deploy.sh"
                


