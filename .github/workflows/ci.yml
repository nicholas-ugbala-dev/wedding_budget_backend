name: PlannerHub Backend CI

on:
    push:
        branches:
            - staging

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                node-version: 22
            
            - name: Install dependencies
              run: npm ci

            - name: Build application
              run: npm run build

