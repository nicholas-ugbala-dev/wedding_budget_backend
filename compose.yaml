services:
  backend:
    image: ghcr.io/nicholas-ugbala-dev/plannerhub-backend:${IMAGE_TAG}
    container_name: plannerhub-backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    restart: unless-stopped

  postgres:
    image: postgres:17
    container_name: plannerhub-db

    environment:
      POSTGRES_DB: plannerhub
      POSTGRES_USER: plannerhub
      POSTGRES_PASSWORD: secure_password

    volumes:
      - postgres_data:/var/lib/postgresql/data
  
volumes:
  postgres_data:
